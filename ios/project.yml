name: VillaParis
options:
  bundleIdPrefix: it.villaparis
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  VillaParis:
    type: application
    platform: iOS
    sources:
      - path: VillaParis
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.villaparis.gestionale
        PRODUCT_NAME: Villa Paris
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VillaParis/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          API_BASE_URL: "http://localhost:3000"
        Release:
          API_BASE_URL: "https://gestionale.villaparis.it"
    scheme:
      testTargets: []
