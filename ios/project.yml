name: VillaParis
options:
  bundleIdPrefix: it.villaparis
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  VillaParis:
    type: application
    platform: iOS
    sources:
      - path: VillaParis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.villaparis.gestionale
        PRODUCT_NAME: Villa Paris
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Villa Paris
        INFOPLIST_KEY_API_BASE_URL: https://gestionale.villaparis.it
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
    scheme:
      testTargets: []
