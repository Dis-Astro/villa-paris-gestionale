services:
  db:
    image: postgres:16-alpine
    container_name: villaparis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-villaparis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-villaparis_secret}
      POSTGRES_DB: ${POSTGRES_DB:-villaparis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-villaparis} -d ${POSTGRES_DB:-villaparis}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - villaparis-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: villaparis-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://villaparis:villaparis_secret@db:5432/villaparis?schema=public}
      JWT_SECRET: ${JWT_SECRET:-villaparis_change_this_secret_in_env}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CALENDAR_SYNC_SECRET: ${CALENDAR_SYNC_SECRET:-}
      RECORDINGS_DIR: /app/storage/recordings
      HISTORY_DIR: /app/storage/history
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-5.6-terra}
      AI_AUTO_APPLY: ${AI_AUTO_APPLY:-false}
      AI_MIN_CONFIDENCE: ${AI_MIN_CONFIDENCE:-0.90}
      AI_INCLUDE_PERSONAL_DATA: ${AI_INCLUDE_PERSONAL_DATA:-false}
      AI_BATCH_SIZE: ${AI_BATCH_SIZE:-10}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      AI_TOOL_SECRET: ${AI_TOOL_SECRET:-}
      AI_TOOLS_WRITE_ENABLED: ${AI_TOOLS_WRITE_ENABLED:-false}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
      - recordings_data:/app/storage/recordings
      - history_data:/app/storage/history
    networks:
      - villaparis-network

  calendar-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: villaparis-calendar-sync
    restart: unless-stopped
    environment:
      CALENDAR_SYNC_SECRET: ${CALENDAR_SYNC_SECRET:-}
      CALENDAR_SYNC_BASE_URL: http://app:3000
    depends_on:
      - app
    entrypoint: ["node", "scripts/calendar-sync-worker.js"]
    networks:
      - villaparis-network

volumes:
  postgres_data:
  uploads_data:
  recordings_data:
  history_data:

networks:
  villaparis-network:
    driver: bridge
