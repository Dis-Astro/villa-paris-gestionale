services:
  db:
    image: postgres:16-alpine
    container_name: villaparis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-villaparis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-villaparis_secret}
      POSTGRES_DB: ${POSTGRES_DB:-villaparis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-villaparis} -d ${POSTGRES_DB:-villaparis}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - villaparis-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: villaparis-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://villaparis:villaparis_secret@db:5432/villaparis?schema=public}
      JWT_SECRET: ${JWT_SECRET:-villaparis_change_this_secret_in_env}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - villaparis-network

volumes:
  postgres_data:
  uploads_data:

networks:
  villaparis-network:
    driver: bridge
